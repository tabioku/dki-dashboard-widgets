<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DKI Task Status</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: #ffffff;
    color: #191919;
    margin: 0;
    padding: 20px;
  }
  .stats-row {
    display: flex;
    gap: 12px;
    margin-bottom: 24px;
  }
  .stat-card {
    flex: 1;
    background: #f7f7f5;
    border-radius: 8px;
    padding: 12px 14px;
  }
  .stat-num {
    font-size: 26px;
    font-weight: 700;
    line-height: 1.1;
  }
  .stat-label {
    font-size: 12px;
    color: #6b6b68;
    margin-top: 4px;
  }
  .not-started .stat-num { color: #D6232C; }
  .paused .stat-num { color: #E9A23B; }
  .started .stat-num { color: #1171AE; }

  .funnel-wrap {
    width: 100%;
  }
  .funnel-label {
    fill: #ffffff;
    font-size: 14px;
    font-weight: 600;
    text-anchor: middle;
    dominant-baseline: middle;
  }
  .funnel-value {
    fill: #ffffff;
    font-size: 12px;
    font-weight: 400;
    text-anchor: middle;
    dominant-baseline: middle;
    opacity: 0.85;
  }
</style>
</head>
<body>

  <div class="stats-row">
    <div class="stat-card not-started">
      <div class="stat-num" id="not-started-count">–</div>
      <div class="stat-label">Not started</div>
    </div>
    <div class="stat-card paused">
      <div class="stat-num" id="paused-count">–</div>
      <div class="stat-label">Paused</div>
    </div>
    <div class="stat-card started">
      <div class="stat-num" id="started-count">–</div>
      <div class="stat-label">Started</div>
    </div>
  </div>

  <div class="funnel-wrap">
    <svg id="funnel" viewBox="0 0 900 260" width="100%" height="260" role="img" aria-label="Funnel chart showing pipeline of not started, paused, and started tasks">
    </svg>
  </div>

<script>
  async function loadData() {
    try {
      const res = await fetch('./data.json?t=' + Date.now());
      if (!res.ok) throw new Error('data.json not found');
      return await res.json();
    } catch (err) {
      return { notStarted: 0, paused: 0, started: 0 };
    }
  }

  function drawFunnel(values) {
    // values: [{label, value, color}]
    const svgNS = "http://www.w3.org/2000/svg";
    const svg = document.getElementById('funnel');
    const width = 900;
    const height = 260;
    const topMargin = 20;
    const bottomMargin = 20;
    const maxHeight = height - topMargin - bottomMargin;
    const segWidth = width / values.length;

    const maxVal = Math.max(...values.map(v => v.value), 1);
    const minHeightFloor = 24; // so zero/small values still show a visible sliver

    // compute left/right edge heights for each segment boundary (funnel taper)
    const edgeHeights = values.map(v => Math.max((v.value / maxVal) * maxHeight, minHeightFloor));
    edgeHeights.push(minHeightFloor * 0.6); // taper to a point at the end

    values.forEach((seg, i) => {
      const x0 = i * segWidth;
      const x1 = (i + 1) * segWidth;
      const h0 = edgeHeights[i];
      const h1 = edgeHeights[i + 1];
      const yTop0 = topMargin + (maxHeight - h0) / 2;
      const yBot0 = yTop0 + h0;
      const yTop1 = topMargin + (maxHeight - h1) / 2;
      const yBot1 = yTop1 + h1;

      const points = `${x0},${yTop0} ${x1},${yTop1} ${x1},${yBot1} ${x0},${yBot0}`;
      const poly = document.createElementNS(svgNS, 'polygon');
      poly.setAttribute('points', points);
      poly.setAttribute('fill', seg.color);
      if (i > 0) poly.setAttribute('stroke', '#ffffff');
      if (i > 0) poly.setAttribute('stroke-width', '2');
      svg.appendChild(poly);

      const labelY = topMargin + maxHeight / 2 - 8;
      const valueY = topMargin + maxHeight / 2 + 12;
      const labelX = x0 + segWidth / 2;

      const label = document.createElementNS(svgNS, 'text');
      label.setAttribute('x', labelX);
      label.setAttribute('y', labelY);
      label.setAttribute('class', 'funnel-label');
      label.textContent = seg.label;
      svg.appendChild(label);

      const value = document.createElementNS(svgNS, 'text');
      value.setAttribute('x', labelX);
      value.setAttribute('y', valueY);
      value.setAttribute('class', 'funnel-value');
      value.textContent = seg.value;
      svg.appendChild(value);
    });
  }

  loadData().then(data => {
    document.getElementById('not-started-count').textContent = data.notStarted;
    document.getElementById('paused-count').textContent = data.paused;
    document.getElementById('started-count').textContent = data.started;

    drawFunnel([
      { label: 'Not started', value: data.notStarted, color: '#D6232C' },
      { label: 'Paused', value: data.paused, color: '#E9A23B' },
      { label: 'Started', value: data.started, color: '#1171AE' }
    ]);
  });
</script>

</body>
</html>
